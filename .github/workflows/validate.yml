name: Validar suite Digitalisimo

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxis PHP
        run: find digitalisimo-seo digitalisimo-ia-tools digitalisimo-hosting digitalisimo-backups digitalisimo-tools digitalisimo-elements digitalisimo-migration -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Probar la suite
        # Misma lista en validate.yml y release.yml (tests/repo-hygiene.mjs lo comprueba).
        run: |
          node tests/repo-hygiene.mjs
          node tests/update-in-place.mjs
          node tests/digitalisimo-ui.mjs
          node tests/elements-vendor-static.mjs
          for module in seo ia hosting backups tools elements migration; do php tests/update-enqueue.php "$module"; done
          php tests/elements-slider-widget.php
          php tests/elements-slider-registration.php
          php tests/elements-slider-loading.php
          node tests/elements-slider-multiple.mjs
          php tests/elements-animated-link.php
          php tests/elements-animated-link-legacy.php
          php tests/elements-fancy-list.php
          php tests/elements-document-viewer.php
          php tests/elements-logos.php
          php tests/elements-image-markup.php
          php tests/elements-front-budget.php
          php tests/elements-advanced-heading.php
          php tests/elements-external-row.php
          php tests/elements-google-reviews.php
          php tests/elements-notification.php
          node tests/elements-notification-events.mjs
          php tests/elements-product-grid.php
          php tests/elements-qr-code.php
          php tests/elements-table.php
          php tests/elements-vertical-menu.php
          php tests/elements-offcanvas.php
          php tests/elements-progress-reading.php
          php tests/elements-media-hours.php
          php tests/elements-marquee-timeline.php
          php tests/elements-chart-map.php
          node tests/elements-offcanvas.mjs
          php tests/elements-scroll-button.php
          php tests/elements-accordion.php
          php tests/elements-advanced-button.php
          php tests/elements-advanced-divider.php
          php tests/elements-advanced-icon-box.php
          php tests/elements-animated-heading.php
          node tests/elements-animated-heading-instances.mjs
          php tests/elements-breadcrumbs.php
          php tests/elements-dual-button.php
          php tests/elements-call-out.php
          php tests/elements-actions.php
          php tests/elements-comparison-switcher.php
          php tests/elements-gallery-creative.php
          php tests/elements-device-card.php
          php tests/elements-icon-navigation.php
          php tests/elements-backdrop-filter.php
          php tests/elements-fancy-icons.php
          php tests/elements-fancy-slider.php
          php tests/elements-fancy-tabs.php
          php tests/elements-featured-box.php
          php tests/elements-floating-effects.php
          node tests/elements-floating-effects.mjs
          php tests/elements-icon-mobile-menu.php
          php tests/elements-icon-nav.php
          php tests/elements-image-shadow.php
          php tests/elements-login-registration.php
          php tests/elements-notation.php
          php tests/elements-shape-builder.php
          php tests/elements-tags-cloud.php
          php tests/elements-text-gradient.php
          php tests/elements-total-count.php
          php tests/elements-user-register.php
          php tests/elements-widget-assets.php
          php tests/elements-duplicator.php
          php tests/elements-display-conditions.php
          php tests/elements-legacy-visibility.php
          php tests/elements-visitor-content.php
          php tests/elements-legacy-adapters.php
          php tests/elements-native-features.php
          php tests/elements-author-box-extras.php
          php tests/elements-video-player.php
          php tests/elements-products-carousel.php
          php tests/elements-core-loader.php
          php tests/elements-updater-manifest.php
          php tests/elements-sibling-updates.php
          php tests/updater-real-folder.php
          php tests/backups-updater-manifest.php
          php tests/tools-updater-manifest.php
          php tests/migration-updater.php
          php tests/migration-conditions-repair.php
          php tests/migration-runner.php
          php tests/migration-dropped-extensions.php
          php tests/elements-visitor-counters.php
          php tests/elements-identity.php
          php tests/elements-vendor-guard.php
          php tests/digitalisimo-ui-loader.php
          php tests/elements-palette.php
          node tests/elements-legacy-decisions.mjs
          php tests/elements-legacy-extensions.php
          php tests/elements-legacy-shapes.php
          php tests/elements-legacy-masks.php
          node tests/elements-carousel-engine.mjs
          php tests/performance-hero.php
          php tests/tools-updater.php
