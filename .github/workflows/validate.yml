name: Validar suite Digitalisimo

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar sintaxis PHP
        run: find digitalisimo-seo digitalisimo.chatbot digitalisimo-hosting digitalisimo-backups digitalisimo-tools -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Probar protecciones de rendimiento
        run: |
          php tests/performance-runtime.php
          php tests/performance-diagnostics.php
          php tests/performance-cache.php
          php tests/performance-inheritance.php
          php tests/performance-debug.php
          php tests/performance-css.php
          php tests/performance-fonts.php
          php tests/performance-font-guard.php
          php tests/performance-font-optimizer.php
          php tests/performance-font-policy.php
          php tests/performance-images.php
          php tests/performance-javascript.php
          php tests/quality-rules.php
          php tests/quality-audit.php
          php tests/llms.php
          php tests/image-alt.php
          php tests/favicon.php
          php tests/schema.php
          php tests/tools-site-options.php
          php tests/hosting-migration.php
          php tests/performance-preloads.php
          php tests/performance-migration.php
          php tests/performance-tracking.php
          php tests/seo-release-check.php
          php tests/performance-form-ui.php
      - name: Construir paquetes limpios
        run: |
          mkdir -p dist
          find dist -maxdepth 1 -type f -name '*.zip' -delete
          bash scripts/build-packages.sh dist
      - name: Validar suite y paquetes
        run: |
          DIGITALISIMO_PACKAGE_DIR=dist node tests/validate-suite.mjs
          DIGITALISIMO_PACKAGE_DIR=dist node scripts/verify-release.mjs

      - name: Guardar ZIP SEO para pruebas y reversión
        uses: actions/upload-artifact@v4
        with:
          name: digitalisimo-seo-${{ github.sha }}
          path: dist/digitalisimo-seo-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Validar puente MCP WordPress
        run: |
          cd integrations/mcp-publisher
          npm install --no-audit --no-fund
          node --check server.mjs
          npm test
