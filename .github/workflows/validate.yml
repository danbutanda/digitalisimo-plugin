          php tests/performance-runtime.php
          php tests/performance-diagnostics.php
          php tests/performance-cache.php
          php tests/performance-inheritance.php
          php tests/performance-debug.php
          php tests/performance-css.php
          php tests/performance-fonts.php
          php tests/performance-font-inline.php
          php tests/performance-font-guard.php
          php tests/performance-font-optimizer.php
          php tests/performance-font-policy.php
          php tests/performance-images.php
          php tests/performance-javascript.php
          php tests/quality-rules.php
          php tests/quality-audit.php
