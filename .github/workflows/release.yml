name: Publicar módulos Digitalisimo

on:
  push:
    branches: [main]
    paths:
      - 'digitalisimo-seo/**'
      - 'digitalisimo.chatbot/**'
      - 'digitalisimo-hosting/**'
      - 'digitalisimo-backups/**'
      - 'digitalisimo-tools/**'
      - 'digitalisimo-elements/**'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Slugs de los plugins a publicar, separados por espacios'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: digitalisimo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validar sintaxis PHP
        run: find digitalisimo-seo digitalisimo.chatbot digitalisimo-hosting digitalisimo-backups digitalisimo-tools digitalisimo-elements -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Probar protecciones de rendimiento
        run: |
          node tests/update-in-place.mjs
          for module in seo ia hosting backups tools elements; do php tests/update-enqueue.php "$module"; done
          php tests/tools-slider.php
          php tests/elements-slider-registration.php
          php tests/elements-animated-link.php
          php tests/elements-animated-link-legacy.php
          php tests/elements-fancy-list.php
          php tests/elements-document-viewer.php
          php tests/elements-brand-carousel.php
          php tests/elements-logo-carousel.php
          php tests/elements-advanced-heading.php
          php tests/elements-brand-grid.php
          node tests/elements-carousel-engine.mjs
          php tests/performance-hero.php
          php tests/tools-updater.php
          php tests/updater-isolation.php seo
          php tests/updater-isolation.php hosting
          php tests/updater-isolation.php ia
          php tests/performance-runtime.php
          php tests/performance-diagnostics.php
          php tests/performance-cache.php
          php tests/performance-inheritance.php
          php tests/performance-debug.php
          php tests/performance-css.php
          php tests/performance-fonts.php
          php tests/performance-font-inline.php
          php tests/performance-font-guard.php
          php tests/performance-font-optimizer.php
          php tests/performance-font-policy.php
          php tests/performance-images.php
          php tests/performance-javascript.php
          php tests/quality-rules.php
          php tests/quality-audit.php
          php tests/llms.php
          php tests/seo-excerpt.php
          php tests/image-alt.php
          php tests/favicon.php
          php tests/schema.php
          php tests/schema-detection.php
          php tests/elements.php
          php tests/elements-load-order.php
          php tests/hosting-migration.php
          php tests/backups-sftp.php
          php tests/backups-integrity.php
          php tests/backups-manifest.php
          php tests/backups-policies.php
          php tests/backups-streaming.php
          php tests/backups-storage.php
          php tests/backups-operation-lock.php
          php tests/backups-manual-progress.php
          php tests/backups-cloud-verification.php
          php tests/backups-updater.php
          php tests/tools-site-options.php
          php tests/performance-preloads.php
          php tests/performance-migration.php
          php tests/performance-tracking.php
          php tests/performance-site-kit.php
          php tests/seo-release-check.php
          php tests/performance-form-ui.php
          php tests/sitemap.php
          php tests/sitemap-routes.php
          php tests/robots.php
          php tests/seo-ai-robots.php
      - name: Seleccionar plugins modificados
        id: modules
        env:
          INPUT_MODULES: ${{ inputs.modules }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            read -r -a modules <<< "$INPUT_MODULES"
          else
            changed="$(bash scripts/changed-modules.sh "$BEFORE_SHA" "$HEAD_SHA")"
            test -n "$changed"
            mapfile -t modules <<< "$changed"
          fi
          test "${#modules[@]}" -gt 0
          echo "names=${modules[*]}" >> "$GITHUB_OUTPUT"
      - name: Preparar paquetes para validar toda la suite
        run: bash scripts/build-packages.sh "$RUNNER_TEMP/digitalisimo-suite"
      - name: Validar suite
        env:
          DIGITALISIMO_PACKAGE_DIR: ${{ runner.temp }}/digitalisimo-suite
        run: node tests/validate-suite.mjs
      - name: Preparar y validar sólo los plugins modificados
        env:
          MODULES: ${{ steps.modules.outputs.names }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r -a modules <<< "$MODULES"
          bash scripts/build-packages.sh "$RUNNER_TEMP/digitalisimo-packages" "${modules[@]}"
          DIGITALISIMO_PACKAGE_DIR="$RUNNER_TEMP/digitalisimo-packages" node scripts/verify-release.mjs --remote "${modules[@]}"
      - name: Preparar etiqueta numerada
        id: tag
        run: echo "name=v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Publicar Release y assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/digitalisimo-packages/*.zip
