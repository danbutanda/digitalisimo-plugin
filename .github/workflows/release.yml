name: Publicar módulos Digitalisimo

on:
  push:
    branches: [main]
    paths:
      - 'digitalisimo-seo/**'
      - 'digitalisimo-ecommerce/**'
      - 'digitalisimo.chatbot/**'
      - 'digitalisimo-hosting/**'
      - 'digitalisimo-backups/**'
      - 'digitalisimo-tools/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digitalisimo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validar sintaxis PHP
        run: find digitalisimo-seo digitalisimo-ecommerce digitalisimo.chatbot digitalisimo-hosting digitalisimo-backups digitalisimo-tools -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Preparar paquetes instalables limpios
        run: bash scripts/build-packages.sh "$RUNNER_TEMP/digitalisimo-packages"
      - name: Validar suite, assets y versiones publicadas
        env:
          DIGITALISIMO_PACKAGE_DIR: ${{ runner.temp }}/digitalisimo-packages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tests/validate-suite.mjs
          node scripts/verify-release.mjs --remote
      - name: Preparar etiqueta numerada
        id: tag
        run: echo "name=v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Publicar Release y assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/digitalisimo-packages/*.zip
