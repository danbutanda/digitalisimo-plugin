      - name: Seleccionar plugins modificados
        id: modules
        env:
          INPUT_MODULES: ${{ inputs.modules }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          modules=()
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            # Sin módulos, la ejecución manual vuelve a publicar el ZIP vigente de todos.
            read -r -a modules <<< "$INPUT_MODULES"
          else
            changed="$(bash scripts/changed-modules.sh "$BEFORE_SHA" "$HEAD_SHA")"
            test -n "$changed"
            mapfile -t modules <<< "$changed"
            test "${#modules[@]}" -gt 0
          fi
          echo "names=${modules[*]}" >> "$GITHUB_OUTPUT"
      - name: Preparar paquetes para validar toda la suite
        run: bash scripts/build-packages.sh "$RUNNER_TEMP/digitalisimo-suite"
      - name: Validar suite
        env:
          DIGITALISIMO_PACKAGE_DIR: ${{ runner.temp }}/digitalisimo-suite
        run: node tests/validate-suite.mjs
      - name: Comprobar que los plugins modificados superan su versión publicada
        if: steps.modules.outputs.names != ''
        env:
          MODULES: ${{ steps.modules.outputs.names }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          read -r -a modules <<< "$MODULES"
          bash scripts/build-packages.sh "$RUNNER_TEMP/digitalisimo-packages" "${modules[@]}"
          DIGITALISIMO_PACKAGE_DIR="$RUNNER_TEMP/digitalisimo-packages" node scripts/verify-release.mjs --remote "${modules[@]}"
      - name: Comprobar que la Release lleva el ZIP vigente de los siete plugins y del tema
        env:
          DIGITALISIMO_PACKAGE_DIR: ${{ runner.temp }}/digitalisimo-suite
        run: node scripts/verify-release.mjs
      - name: Preparar etiqueta numerada y notas
        id: tag
        env:
          MODULES: ${{ steps.modules.outputs.names }}
        run: |
          tag="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          # Índice de versiones que los actualizadores leen como archivo de la última Release.
          node scripts/release-manifest.mjs "$RUNNER_TEMP/digitalisimo-suite" "$tag"
          {
            echo 'body<<NOTAS'
            if [[ -n "$MODULES" ]]; then echo "Paquetes con versión nueva: ${MODULES}."; else echo 'Sin versiones nuevas: vuelve a publicar el ZIP vigente de cada plugin y del tema.'; fi
            echo
            echo 'Esta Release incluye siempre el ZIP vigente de los siete plugins Digitalisimo y del tema, para que cada uno y su versión más reciente estén en la última Release.'
            echo 'NOTAS'
          } >> "$GITHUB_OUTPUT"
      - name: Publicar Release y assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          body: ${{ steps.tag.outputs.body }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/digitalisimo-suite/*.zip
            ${{ runner.temp }}/digitalisimo-suite/digitalisimo-plugins.json
