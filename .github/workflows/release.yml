name: Publicar módulos Digitalisimo

on:
  push:
    branches: [main]
    paths:
      - 'digitalisimo-seo/**'
      - 'digitalisimo-ia-tools/**'
      - 'digitalisimo-hosting/**'
      - 'digitalisimo-backups/**'
      - 'digitalisimo-tools/**'
      - 'digitalisimo-elements/**'
      - 'digitalisimo-migration/**'
      - 'digitalisimo-theme/**'
  workflow_dispatch:
    inputs:
      modules:
        description: 'Slugs de los plugins o del tema con versión nueva, separados por espacios. Vacío: vuelve a publicar el ZIP vigente de los siete plugins y del tema sin cambiar versiones.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: digitalisimo-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validar sintaxis PHP
        run: find digitalisimo-seo digitalisimo-ia-tools digitalisimo-hosting digitalisimo-backups digitalisimo-tools digitalisimo-elements digitalisimo-migration digitalisimo-theme -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Probar la suite
        # Misma lista en validate.yml y release.yml (tests/repo-hygiene.mjs lo comprueba).
        run: |
          node tests/repo-hygiene.mjs
          node tests/update-in-place.mjs
          node tests/digitalisimo-ui.mjs
          node tests/elements-vendor-static.mjs
          for module in seo ia hosting backups tools elements migration; do php tests/update-enqueue.php "$module"; done
